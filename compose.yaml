name: calculator-devops

services:
  calculator:
    image: "${IMAGE_NAME:-calculator-api}:${IMAGE_TAG:-1.0}"
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/actuator/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - calculator-network

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calculator-network

networks:
  calculator-network:
    driver: bridge
